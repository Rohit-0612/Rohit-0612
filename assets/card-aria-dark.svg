<svg xmlns="http://www.w3.org/2000/svg" width="580" height="400" viewBox="0 0 580 400" role="img" aria-label="ARIA — A clinical pharmacotherapy assistant where a Judge agent scores groundedness before any answer reaches the user."><title>ARIA — A clinical pharmacotherapy assistant where a Judge agent scores groundedness before any answer reaches the user.</title><style>text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}@font-face{font-family:'mono500';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'sans400';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'sans600';src:url(data:font/woff2;base64,) format('woff2');}@keyframes ping{0%{r:4px;opacity:.55}80%,100%{r:11px;opacity:0}}.ping{animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B91FF"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient></defs><rect x="0.5" y="0.5" width="579" height="399" rx="16" fill="#0B0B0E" stroke="#24242B"/><rect x="36" y="0" width="56" height="2" fill="url(#g)"/><text x="36.0" y="58.0" font-family="mono500" font-size="15" fill="#8B91FF" letter-spacing="1.5" >01</text><text x="72.0" y="58.0" font-family="mono500" font-size="15" fill="#6B6B76" letter-spacing="1.5" >CLINICAL RAG · MULTI-AGENT</text><rect x="472.4" y="38" width="71.6" height="28" rx="14" fill="none" stroke="#24242B"/><circle class="ping" cx="486.4" cy="52" r="3.5" fill="#5EEAD4"/><circle cx="486.4" cy="52" r="3.5" fill="#5EEAD4"/><text x="496.4" y="57.0" font-family="mono500" font-size="14" fill="#5EEAD4" letter-spacing="1.5" >LIVE</text><text x="34.0" y="118.0" font-family="sans600" font-size="36" fill="#FAFAFA" letter-spacing="-1.2" >ARIA</text><text x="36.0" y="160.0" font-family="sans400" font-size="20" fill="#A1A1AA" letter-spacing="-0.15" >A clinical pharmacotherapy assistant where